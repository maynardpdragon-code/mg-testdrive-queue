<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 140" width="640" height="140" role="img" aria-label="MG Test Drive">
  <defs>
    <linearGradient id="mgRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e30613"/>
      <stop offset="100%" stop-color="#a4030d"/>
    </linearGradient>
  </defs>

  <!-- angled red accent block -->
  <polygon points="0,20 70,20 50,120 -20,120" fill="url(#mgRed)"/>

  <!-- MG wordmark -->
  <text x="90" y="98" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900"
        font-size="88" letter-spacing="-2" fill="#ffffff" font-style="italic">MG</text>

  <!-- divider -->
  <rect x="272" y="30" width="5" height="80" fill="#e30613"/>

  <!-- subtext -->
  <text x="296" y="66" font-family="Arial, Helvetica, sans-serif" font-weight="700"
        font-size="30" letter-spacing="4" fill="#ffffff">TEST DRIVE</text>
  <text x="296" y="96" font-family="Arial, Helvetica, sans-serif" font-weight="400"
        font-size="20" letter-spacing="6" fill="#c9c9c9">EXPERIENCE</text>
</svg>
